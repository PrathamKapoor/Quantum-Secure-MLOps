<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-family="Arial">Guardrailed Agentic MLOps Architecture</text>
  
  <!-- Layer 1: Quantum Trust Layer (Bottom) -->
  <rect x="50" y="80" width="200" height="100" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
  <text x="150" y="110" text-anchor="middle" font-size="14" font-family="Arial" font-weight="bold">1. Quantum Trust Layer</text>
  <text x="150" y="130" text-anchor="middle" font-size="12" font-family="Arial">• Post-Quantum Cryptography</text>
  <text x="150" y="150" text-anchor="middle" font-size="12" font-family="Arial">(ML-KEM, ML-DSA, SHA-3)</text>
  <text x="150" y="170" text-anchor="middle" font-size="12" font-family="Arial">• Cryptographic Agility</text>
  <text x="150" y="190" text-anchor="middle" font-size="12" font-family="Arial">• Key Management</text>
  
  <!-- Layer 2: Verification Engine -->
  <rect x="300" y="80" width="200" height="100" fill="#e6ffe6" stroke="#009900" stroke-width="2"/>
  <text x="400" y="110" text-anchor="middle" font-size="14" font-family="Arial" font-weight="bold">2. Verification Engine</text>
  <text x="400" y="130" text-anchor="middle" font-size="12" font-family="Arial">• Verification Packets</text>
  <text x="400" y="150" text-anchor="middle" font-size="12" font-family="Arial">• Evidence Ledger</text>
  <text x="400" y="170" text-anchor="middle" font-size="12" font-family="Arial">(Hash-chained, append-only)</text>
  
  <!-- Layer 3: Model Trust System -->
  <rect x="550" y="80" width="200" height="100" fill="#ffe6e6" stroke="#cc0000" stroke-width="2"/>
  <text x="650" y="110" text-anchor="middle" font-size="14" font-family="Arial" font-weight="bold">3. Model Trust System</text>
  <text x="650" y="130" text-anchor="middle" font-size="12" font-family="Arial">• Model Passport</text>
  <text x="650" y="150" text-anchor="middle" font-size="12" font-family="Arial">• QML-BOM</text>
  <text x="650" y="170" text-anchor="middle" font-size="12" font-family="Arial">• Secure Registry</text>
  
  <!-- Layer 4: Agentic MLOps Layer -->
  <rect x="50" y="220" width="350" height="120" fill="#fff0e6" stroke="#ff9900" stroke-width="2"/>
  <text x="225" y="240" text-anchor="middle" font-size="14" font-family="Arial" font-weight="bold">4. Agentic MLOps Layer</text>
  <text x="225" y="260" text-anchor="middle" font-size="12" font-family="Arial">• Specialized Agents (5)</text>
  <text x="225" y="280" text-anchor="middle" font-size="12" font-family="Arial">(Data, Performance, Security,</text>
  <text x="225" y="300" text-anchor="middle" font-size="12" font-family="Arial">  Quantum Security, Red Team)</text>
  <text x="225" y="320" text-anchor="middle" font-size="12" font-family="Arial">• Adaptive Supervisor</text>
  <text x="225" y="340" text-anchor="middle" font-size="12" font-family="Arial">(Observe → Detect → Reason → Act → Verify → Learn)</text>
  
  <!-- Layer 5: Self-Healing Pipeline -->
  <rect x="450" y="220" width="300" height="120" fill="#e6e6ff" stroke="#6600cc" stroke-width="2"/>
  <text x="600" y="240" text-anchor="middle" font-size="14" font-family="Arial" font-weight="bold">5. Self-Healing Pipeline</text>
  <text x="600" y="260" text-anchor="middle" font-size="12" font-family="Arial">Provision → Train → Build QML-BOM →</text>
  <text x="600" y="280" text-anchor="middle" font-size="12" font-family="Arial">Sign Passport → Register → Agent Eval →</text>
  <text x="600" y="300" text-anchor="middle" font-size="12" font-family="Arial">Supervisor Decision → Deploy Gate →</text>
  <text x="600" y="320" text-anchor="middle" font-size="12" font-family="Arial">Health Monitor → Auto Recovery</text>
  <text x="600" y="340" text-anchor="middle" font-size="12" font-family="Arial">(Retrain/Verify/Deploy or Rollback)</text>
  
  <!-- Arrows -->
  <line x1="150" y1="180" x2="150" y2="220" stroke="#000000" stroke-width="2"/>
  <polygon points="145,225 155,225 150,230" fill="#000000"/>
  
  <line x1="400" y1="180" x2="400" y2="220" stroke="#000000" stroke-width="2"/>
  <polygon points="395,225 405,225 400,230" fill="#000000"/>
  
  <line x1="650" y1="180" x2="650" y2="220" stroke="#000000" stroke-width="2"/>
  <polygon points="645,225 655,225 650,230" fill="#000000"/>
  
  <!-- Human Operator and Bounded Agentic AI -->
  <text x="400" y="380" text-anchor="middle" font-size="14" font-family="Arial" font-style="italic">Human Operator ↔ Bounded Agentic AI (via Adaptive Supervisor)</text>
  
  <!-- Data Flow -->
  <text x="400" y="400" text-anchor="middle" font-size="12" font-family="Arial" fill="#006600">Data Flow: Historical Data → Features → Models → Predictions → Metrics → Actions</text>
  
  <!-- Footer -->
  <text x="400" y="580" text-anchor="middle" font-size="10" font-family="Arial" fill="#666660">Figure 1: System architecture for guardrailed agentic MLOps in energy forecasting</text>
</svg>